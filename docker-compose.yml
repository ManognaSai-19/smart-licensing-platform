services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: slp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: licensingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d licensingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot REST Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: slp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/licensingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  # 3. Mobile PWA Frontend & Nginx Gateway
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: slp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
