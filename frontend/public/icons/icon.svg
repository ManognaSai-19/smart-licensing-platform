<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Neon Glowing Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800 280" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="800 280" />

  <!-- Inner Government Emblem / Crest Silhouette -->
  <!-- Pediment / Roof -->
  <path d="M 160 210 L 256 145 L 352 210 Z" fill="#FFFFFF" />

  <!-- Architrave -->
  <rect x="170" y="218" width="172" height="12" rx="3" fill="#FFFFFF" />

  <!-- 4 Pillars -->
  <rect x="186" y="238" width="20" height="88" rx="4" fill="#93C5FD" />
  <rect x="226" y="238" width="20" height="88" rx="4" fill="#60A5FA" />
  <rect x="266" y="238" width="20" height="88" rx="4" fill="#60A5FA" />
  <rect x="306" y="238" width="20" height="88" rx="4" fill="#93C5FD" />

  <!-- Base Podium -->
  <rect x="168" y="334" width="176" height="16" rx="4" fill="#FFFFFF" />
  <rect x="156" y="354" width="200" height="14" rx="4" fill="#CBD5E1" />

  <!-- Central Star Accent -->
  <circle cx="256" cy="182" r="8" fill="#FBBF24" />
</svg>
