# Server Port
server.port=8080

# Application Name
spring.application.name=smart-licensing-platform

# PostgreSQL Datasource (Configured via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/licensing_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Security Configuration
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Storage Configuration
app.storage.upload-dir=${APP_STORAGE_DIR:./storage/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Logging
logging.level.com.licensing.platform=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=WARN
